<header class="topbar">
  <a routerLink="/inspections" class="brand">🔍 InspectionTracker</a>
  <nav>
    @if (auth.isLoggedIn()) {
      <span class="user">{{ auth.displayName() }}</span>
      <button class="link" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register">Register</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>
